name: raindrop_client
description: "Raindrop's cross-platform client: connects to a Raindrop server and presents its chats."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  # Native memory for asking Windows which process owns a window, before a
  # window's sound is shared (core/platform/windows_processes.dart).
  ffi: ^2.1.0
  file_selector: ^1.1.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Must match the Rust crate's flutter_rust_bridge and the installed codegen exactly.
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.0.0
  flutter_webrtc: ^1.6.2+hotfix.3
  go_router: ^18.0.0
  grpc: ^5.1.0
  image: ^4.10.1
  intl: ^0.20.3
  livekit_client: ^2.13.0
  # Video and audio attachments: media_kit everywhere but Windows. Its
  # native libraries come per platform rather than through
  # media_kit_libs_video, so Windows gets none: media_kit_libs_windows_video
  # ships x64-only libmpv and ANGLE, which an ARM64 build cannot link, and
  # without it media_kit_video builds its empty Windows stub. Windows plays
  # through video_player_win instead (core/media/).
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_video: ^2.0.1
  # Windows' player: Media Foundation, so it builds for x64 and ARM64 alike.
  # Used through its own controller rather than video_player, so no other
  # platform's video_player implementation is pulled in.
  video_player_win: ^3.3.2
  mime: ^2.1.0
  mobile_scanner: ^7.4.2
  msgpack_dart: ^1.0.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  # Builds and links the Rust crypto core from ../RaindropCrypto.
  protobuf: ^6.1.0
  qr_flutter: ^4.1.0
  raindrop_crypto_ffi:
    path: native/raindrop_crypto_builder
  # Puts the camera effects into flutter_webrtc's capture pipeline, through its
  # own public API — nothing is forked. See the package's README.
  raindrop_camera_effects:
    path: native/raindrop_camera_effects
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  local_auth: ^3.0.2
  pdf: ^3.13.1

# local_auth_windows 2.0.2 (the latest) does not compile with Visual Studio 18:
# it builds with MSVC's removed /await coroutines and returns from a coroutine
# with `return`. native/local_auth_windows is that release with exactly those
# two lines fixed; drop this override once a fixed release is published.
# See native/local_auth_windows/PATCHED.md.
dependency_overrides:
  local_auth_windows:
    path: native/local_auth_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
