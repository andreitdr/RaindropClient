name: raindrop_client
description: "Raindrop's cross-platform client: connects to a Raindrop server and presents its chats."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_webrtc: ^1.6.2+hotfix.3
  go_router: ^18.0.0
  intl: ^0.20.3
  livekit_client: ^2.13.0
  msgpack_dart: ^1.0.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
