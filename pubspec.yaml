name: raindrop_client
description: "Raindrop's cross-platform client: connects to a Raindrop server and presents its chats."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  dio: ^5.11.0
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Must match the Rust crate's flutter_rust_bridge and the installed codegen exactly.
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.0.0
  flutter_webrtc: ^1.6.2+hotfix.3
  go_router: ^18.0.0
  image: ^4.10.1
  intl: ^0.20.3
  livekit_client: ^2.13.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mime: ^2.1.0
  mobile_scanner: ^7.4.2
  msgpack_dart: ^1.0.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  # Builds and links the Rust crypto core from ../RaindropCrypto.
  qr_flutter: ^4.1.0
  raindrop_crypto_ffi:
    path: native/raindrop_crypto_builder
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
