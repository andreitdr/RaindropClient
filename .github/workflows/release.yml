name: Release

# Starts when release.sh pushes a version tag (vX.Y.Z). Builds and tests the tagged commit (ci.yml),
# packages the artefact, and only if all of that succeeded publishes a GitHub release for the tag
# with the artefact attached. GitHub adds the source-code zip itself.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml
    secrets: inherit # ci.yml needs CRYPTO_REPO_TOKEN

  package:
    name: Package (${{ matrix.name }})
    needs: ci
    strategy:
      matrix:
        include:
          # Linux is built on the oldest supported Ubuntu on purpose: a bundle links against the
          # glibc it was built with and runs on that version or newer, so older = more distributions.
          - { name: linux, os: ubuntu-22.04, bundle: build/linux/x64/release/bundle }
          - { name: macos, os: macos-latest, bundle: build/macos/Build/Products/Release/raindrop_client.app }
          - { name: windows, os: windows-latest, bundle: build/windows/x64/runner/Release }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Windows defaults to PowerShell
        working-directory: RaindropClient
    steps:
      # Same side-by-side layout as ci.yml: the app compiles ../RaindropCrypto (needs CRYPTO_REPO_TOKEN
      # if that repo is private). It builds the crypto repo's current main, not a matching tag.
      - uses: actions/checkout@v4
        with:
          path: RaindropClient
      - uses: actions/checkout@v4
        with:
          repository: andreitdr/RaindropCrypto
          token: ${{ secrets.CRYPTO_REPO_TOKEN || github.token }}
          path: RaindropCrypto

      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build and packaging tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev \
            libmpv-dev libpulse-dev patchelf rpm
          sudo gem install --no-document fpm

      # The project signs with the developer's own Apple Development certificate, which CI doesn't have.
      # Switch to ad-hoc signing on this runner only (the checkout is discarded afterwards).
      - name: Use ad-hoc code signing
        if: matrix.name == 'macos'
        run: |
          perl -pi -e '
            s/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/;
            s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/;
            s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/;
            s/DEVELOPMENT_TEAM = [A-Z0-9]+;/DEVELOPMENT_TEAM = "";/;
          ' macos/Runner.xcodeproj/project.pbxproj
          grep -c 'Apple Development' macos/Runner.xcodeproj/project.pbxproj && exit 1 || true

      # rusqlite's bundled SQLCipher compiles OpenSSL from source, which needs a full Perl and NASM.
      # The Perl on the Windows runner's PATH is Git's cut-down one and fails ("perl reported failure").
      - name: Windows OpenSSL build tools
        if: matrix.name == 'windows'
        uses: shogo82148/actions-setup-perl@v1
        with:
          distribution: strawberry
      - name: Install NASM
        if: matrix.name == 'windows'
        uses: ilammy/setup-nasm@v1

      # Git Bash (the shell used by these steps) puts Git's own cut-down, Cygwin-built perl ahead of
      # Strawberry Perl on PATH, and OpenSSL's Configure fails with it (missing Locale::Maketext::Simple).
      # Point the OpenSSL build at Strawberry Perl explicitly, and put it first on PATH for the build.
      - name: Use Strawberry Perl for OpenSSL
        if: matrix.name == 'windows'
        run: |
          perl_exe="$(ls -d /c/hostedtoolcache/windows/strawberry-perl/*/x64/perl/bin/perl.exe | sort | tail -n 1)"
          [ -n "$perl_exe" ] || { echo "Strawberry Perl not found" >&2; exit 1; }
          echo "OPENSSL_SRC_PERL=$(cygpath -m "$perl_exe")" >> "$GITHUB_ENV"
          echo "STRAWBERRY_PERL_BIN=$(dirname "$perl_exe")" >> "$GITHUB_ENV"

      # OpenSSL's build tree is deep. Under cargokit's default folder (inside build/, inside the doubled
      # workspace path) its longest files exceed Windows' 260-character path limit, and Perl's Configure
      # then fails with "No such file or directory" (exit code 2). Build in a short folder instead.
      # Runner-only edit; the repository's copy of cargokit is untouched.
      - name: Shorten cargokit build path
        if: matrix.name == 'windows'
        run: |
          file=native/raindrop_crypto_builder/cargokit/cmake/cargokit.cmake
          sed -i 's|set(CARGOKIT_TEMP_DIR "${CMAKE_CURRENT_BINARY_DIR}/cargokit_build")|set(CARGOKIT_TEMP_DIR "C:/ck")|' "$file"
          grep -n 'CARGOKIT_TEMP_DIR "C:/ck"' "$file"

      - run: flutter pub get

      - name: Build release
        run: |
          if [ -n "${STRAWBERRY_PERL_BIN:-}" ]; then export PATH="$STRAWBERRY_PERL_BIN:$PATH"; fi
          flutter build ${{ matrix.name }} --release --build-name "${GITHUB_REF_NAME#v}"

      # Windows and macOS builds already carry libmpv (media_kit_libs_video). Linux does not, so it
      # is copied in here, then wrapped as AppImage + .deb + .rpm.
      - name: Package (linux)
        if: matrix.name == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/linux/bundle-libs.sh "${{ matrix.bundle }}"
          packaging/linux/build-packages.sh "$VERSION" "${{ matrix.bundle }}" dist

      # A disk image with the app and an Applications shortcut: open it and drag the app across.
      - name: Package (macos)
        if: matrix.name == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist dmg-stage
          # ditto keeps symlinks, resource forks and the code signature intact.
          ditto "${{ matrix.bundle }}" dmg-stage/RaindropClient.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Raindrop" -srcfolder dmg-stage -ov -format UDZO "dist/RaindropClient-$VERSION-macos.dmg"

      # Flutter's Windows exe needs the Visual C++ runtime; a clean PC may not have it, so ship the
      # DLLs next to the exe (Microsoft allows this "app-local" deployment of the redistributable).
      - name: Package (windows)
        if: matrix.name == 'windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          crt="$(ls -d "/c/Program Files/Microsoft Visual Studio/"*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT 2>/dev/null | sort | tail -n 1)"
          [ -n "$crt" ] || { echo "Visual C++ runtime folder not found" >&2; exit 1; }
          echo "Bundling runtime from: $crt"
          cp "$crt"/*.dll "${{ matrix.bundle }}/"
          mkdir -p dist
          (cd "${{ matrix.bundle }}" && 7z a -tzip "$GITHUB_WORKSPACE/RaindropClient/dist/RaindropClient-$VERSION-windows.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: RaindropClient/dist/*

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release for the existing tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
