name: CI/CD

# On every push to main: build, then test. Releases are not made here; tag them
# with release.sh in the Raindrop root folder, which triggers release.yml.

# REQUIRED SETUP: the app compiles the Rust crypto core from the sibling RaindropCrypto repo
# (fixed ../../../../RaindropCrypto paths in native/raindrop_crypto_builder). If that repo is
# private, add a repository secret CRYPTO_REPO_TOKEN: a fine-grained personal access token with
# read-only "Contents" access to andreitdr/RaindropCrypto. The default GITHUB_TOKEN cannot read
# other repositories.

on:
  push:
    branches: [main]
  workflow_call: # also run as the first stage of release.yml

# A newer push supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CRYPTO_REPO: andreitdr/RaindropCrypto

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false # one platform failing shouldn't hide the others' results
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
          # The mobile targets. Android builds on Linux (the runner image ships the SDK);
          # iOS needs a Mac. Neither is set up on the reference dev machine, so CI is where
          # these two are actually proven — see RaindropClient/docs/mobile.md.
          - { name: android, os: ubuntu-latest }
          - { name: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    # The workspace mirrors the local layout: <workspace>/RaindropClient next to <workspace>/RaindropCrypto.
    defaults:
      run:
        shell: bash # Windows defaults to PowerShell
        working-directory: RaindropClient
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaindropClient
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CRYPTO_REPO }}
          token: ${{ secrets.CRYPTO_REPO_TOKEN || github.token }}
          path: RaindropCrypto

      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux desktop build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libmpv-dev libpulse-dev

      # Android builds the Rust crypto core once per ABI with the NDK, so the toolchain needs
      # the matching Rust targets and the NDK version Flutter pins (flutter.ndkVersion, which
      # android/app/build.gradle.kts uses). The runner image has the SDK and a JDK already.
      - name: Android build dependencies
        if: matrix.name == 'android'
        run: |
          # One Rust target per ABI in android/app/build.gradle.kts's abiFilters.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          # Accepting the licences lets the Android Gradle Plugin fetch the NDK version
          # Flutter pins by itself, rather than this file having to name a version that
          # would then have to be kept in step with the SDK.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '17'

      # The project signs with the developer's own Apple Development certificate, which CI doesn't have.
      # Switch to ad-hoc signing on this runner only (the checkout is discarded afterwards).
      - name: Use ad-hoc code signing
        if: matrix.name == 'macos'
        run: |
          perl -pi -e '
            s/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/;
            s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/;
            s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/;
            s/DEVELOPMENT_TEAM = [A-Z0-9]+;/DEVELOPMENT_TEAM = "";/;
          ' macos/Runner.xcodeproj/project.pbxproj
          grep -c 'Apple Development' macos/Runner.xcodeproj/project.pbxproj && exit 1 || true

      # rusqlite's bundled SQLCipher compiles OpenSSL from source, which needs a full Perl and NASM.
      # The Perl on the Windows runner's PATH is Git's cut-down one and fails ("perl reported failure").
      - name: Windows OpenSSL build tools
        if: matrix.name == 'windows'
        uses: shogo82148/actions-setup-perl@v1
        with:
          distribution: strawberry
      - name: Install NASM
        if: matrix.name == 'windows'
        uses: ilammy/setup-nasm@v1

      # Git Bash (the shell used by these steps) puts Git's own cut-down, Cygwin-built perl ahead of
      # Strawberry Perl on PATH, and OpenSSL's Configure fails with it (missing Locale::Maketext::Simple).
      # Point the OpenSSL build at Strawberry Perl explicitly, and put it first on PATH for the build.
      - name: Use Strawberry Perl for OpenSSL
        if: matrix.name == 'windows'
        run: |
          perl_exe="$(ls -d /c/hostedtoolcache/windows/strawberry-perl/*/x64/perl/bin/perl.exe | sort | tail -n 1)"
          [ -n "$perl_exe" ] || { echo "Strawberry Perl not found" >&2; exit 1; }
          echo "OPENSSL_SRC_PERL=$(cygpath -m "$perl_exe")" >> "$GITHUB_ENV"
          echo "STRAWBERRY_PERL_BIN=$(dirname "$perl_exe")" >> "$GITHUB_ENV"

      # OpenSSL's build tree is deep. Under cargokit's default folder (inside build/, inside the doubled
      # workspace path) its longest files exceed Windows' 260-character path limit, and Perl's Configure
      # then fails with "No such file or directory" (exit code 2). Build in a short folder instead.
      # Runner-only edit; the repository's copy of cargokit is untouched.
      - name: Shorten cargokit build path
        if: matrix.name == 'windows'
        run: |
          file=native/raindrop_crypto_builder/cargokit/cmake/cargokit.cmake
          sed -i 's|set(CARGOKIT_TEMP_DIR "${CMAKE_CURRENT_BINARY_DIR}/cargokit_build")|set(CARGOKIT_TEMP_DIR "C:/ck")|' "$file"
          grep -n 'CARGOKIT_TEMP_DIR "C:/ck"' "$file"

      - name: Restore packages
        run: flutter pub get

      - name: Static analysis
        if: matrix.name == 'linux' # platform-independent, so once is enough
        run: flutter analyze

      - name: Compile
        if: matrix.name != 'android' && matrix.name != 'ios'
        run: |
          if [ -n "${STRAWBERRY_PERL_BIN:-}" ]; then export PATH="$STRAWBERRY_PERL_BIN:$PATH"; fi
          flutter build ${{ matrix.name }} --release

      # An APK rather than an app bundle: it is the artefact a person can actually install,
      # and it fails on the same things a bundle would. Release signing falls back to the
      # debug keys without android/key.properties, which CI has no business holding.
      - name: Compile (Android)
        if: matrix.name == 'android'
        run: flutter build apk --release

      # No signing identity on a runner, so this builds unsigned — which still compiles the
      # Rust core for arm64 and links every pod, the parts that actually break.
      - name: Compile (iOS)
        if: matrix.name == 'ios'
        run: flutter build ios --release --no-codesign

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RaindropClient
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaindropClient
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CRYPTO_REPO }}
          token: ${{ secrets.CRYPTO_REPO_TOKEN || github.token }}
          path: RaindropCrypto

      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Integration tests skip themselves unless RAINDROP_TEST_SERVER is set, so this runs the unit tests.
      - name: Test
        run: flutter test
