name: raindrop_camera_effects
description: >-
  Attaches a native per-frame processor to a camera track that flutter_webrtc is
  already capturing, so Raindrop's camera effects can rewrite frames in place.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.raindrop.camera_effects
        pluginClass: RaindropCameraEffectsPlugin
      ios:
        pluginClass: RaindropCameraEffectsPlugin
      macos:
        pluginClass: RaindropCameraEffectsPlugin
