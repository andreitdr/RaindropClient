// The Android Gradle Plugin builds the native code with the Android NDK.

group = 'com.flutter_rust_bridge.raindrop_crypto_ffi'
version = '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'com.flutter_rust_bridge.raindrop_crypto_ffi'

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    compileOptions {
        // 17, as the app and the other local plugin: javac warns that 8 is obsolete.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 19
    }
}

// Warnings are errors here too: a release cannot be published while any platform warns.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../../../RaindropCrypto/crates/raindrop_crypto_ffi"
    libname = "raindrop_crypto_ffi"
}
